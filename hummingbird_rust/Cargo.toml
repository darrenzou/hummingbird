[package]
name = "hummingbird_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "hummingbird_rust"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bincode = "1"
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
k256 = { version = "0.13", features = ["ecdsa"] }
libc = "0.2"
native-tls = "0.2"
num-bigint = "0.4"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2", "pem"] }
mysql = { version = "27", features = ["native-tls"] }
postgres = "0.19"
postgres-native-tls = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
signature = "2"
thiserror = "1"
tungstenite = { version = "0.24", features = ["native-tls"] }
ureq = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"
